name: myworkflow1

on:
  push:
  workflow_dispatch:

jobs:
  myjob1:
    runs-on: ubuntu-22.04

    steps:
      - name: mystep1
        run: |
          whoami
          pwd
          cd
          ls -al

      - name: mystep2-clone the repo
        uses: actions/checkout@v4

      - name: mystep3-check the source code
        run: ls -al

      - name: mystep4-build docker image
        run: docker build -t princepanwar21032011/myimage_oct_31:t${{ github.run_number }} -f Dockerfile .

      - name: mystep5-check the docker image
        run: docker images

      - name: mystep6-login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: mystep7-push image to docker
        run: docker push princepanwar21032011/myimage_oct_31:t${{ github.run_number }}
